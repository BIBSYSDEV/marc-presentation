version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'develop'
    cooldown:
      default-days: 7
    groups:
      prod-minor-patch:
        dependency-type: 'production'
        update-types: [ 'minor', 'patch' ]
      dev-minor-patch:
        dependency-type: 'development'
        update-types: [ 'minor', 'patch' ]
      security:
        applies-to: 'security-updates'
        patterns: [ '*' ]
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    target-branch: 'develop'
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: [ '*' ]
